<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App - Tellam Tech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="weather-card">
                    <div class="text-center mb-4">
                        <i class="bi bi-cloud-sun weather-icon"></i>
                        <h1 class="mt-3 mb-2">Weather App</h1>
                        <p class="text-muted">Get current weather information</p>
                    </div>
                    
                    <form action="/weather" method="post">
                        <div class="mb-3">
                            <label for="cityName" class="form-label fw-semibold">Enter City Name:</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-white">
                                    <i class="bi bi-geo-alt-fill text-primary"></i>
                                </span>
                                <input 
                                    type="text" 
                                    class="form-control" 
                                    id="cityName" 
                                    name="cityName" 
                                    placeholder="e.g., Dar es Salaam, London" 
                                    required
                                    autocomplete="off">
                            </div>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-search me-2"></i>Get Weather
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p class="footer-text">
            Powered by <span class="brand-name">Tellam Tech</span> &copy; 2026
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
